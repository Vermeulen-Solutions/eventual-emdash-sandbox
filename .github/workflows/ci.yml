name: Validate Eventual
on: [push, pull_request]
jobs:
  plugin:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        timezone: [UTC, America/New_York]
    env:
      TZ: ${{ matrix.timezone }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/astro-events/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:tooling
      - run: npm run profile
      - run: npm run bundle
      - run: npm run budget
      - run: npm run test:package
      - run: npm ci
        working-directory: examples/astro-events
      - run: npm run check && npm test && npm run test:page
        working-directory: examples/astro-events
