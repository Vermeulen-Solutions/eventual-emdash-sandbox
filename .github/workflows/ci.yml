name: Validate Eventual
on: [push, pull_request]
jobs:
  plugin:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        timezone: [UTC, America/New_York]
    env:
      TZ: ${{ matrix.timezone }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/astro-events/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:tooling
      - run: npm run profile
      - run: npm run bundle
      - run: npm run budget
      - run: npm run test:package
      - run: npx playwright install --with-deps chromium
      - run: npm run test:editor
      - run: npm ci
        working-directory: examples/astro-events
      - run: npm run check
        working-directory: examples/astro-events
      - run: npm test
        working-directory: examples/astro-events
      - run: npm run test:page
        working-directory: examples/astro-events
      - run: node scripts/verify-public-visual.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-${{ matrix.os }}-${{ strategy.job-index }}
          path: |
            reports/browser-acceptance.json
            reports/editor-host.log
            reports/browser-results
            reports/public-visual
